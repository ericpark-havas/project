<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The VIII Factor Test</title>
  <style>
    body {
      font-family: 'Helvetica Neue', sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 20px;
      animation: fadeBody 0.6s ease-in;
    }

    @keyframes fadeBody {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }

    .fade-in {
      animation: fadeIn 0.8s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      text-align: center;
      font-size: 2.5em;
    }

    .subhead {
      text-align: center;
      font-size: 1.2em;
      margin-bottom: 30px;
      color: #555;
    }

    .progress-bar-wrapper {
      background: #ddd;
      border-radius: 20px;
      height: 14px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    #progressBar {
      background-color: #4CAF50;
      height: 100%;
      width: 0%;
      transition: width 0.4s ease;
    }

    .question-block {
      margin-bottom: 25px;
    }

    .question-text {
      margin-bottom: 10px;
      font-weight: bold;
    }

    .rating-options {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .rating-options label {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      background: #eee;
      border-radius: 4px;
      margin: 3px;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .rating-options label:hover {
      background: #ddd;
      transform: scale(1.05);
    }

    .rating-options input {
      display: none;
    }

    .rating-options input:checked + label {
      background: #4CAF50;
      color: white;
      font-weight: bold;
    }

    .submit-button {
      width: 100%;
      background: #4CAF50;
      color: white;
      padding: 15px;
      border: none;
      font-size: 1em;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.3s ease;
    }

    .submit-button:hover {
      background: #45a049;
    }

    /* Modal Styles */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 10px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      position: relative;
      animation: fadeIn 0.5s ease-in-out;
    }

    #closeModal {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 1.5em;
      cursor: pointer;
    }

    .learn-more {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #4CAF50;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container fade-in">
    <h1>Do you have the VIII Factor?</h1>
    <p class="subhead">Rate the following 8 statements on a scale <br>from 1 to 8 to see if you have the <b>VIII Factor</b>🔥 <br><br>1 = strongly disagree, 8 = strong agree </p>

    <div class="progress-bar-wrapper">
      <div id="progressBar"></div>
    </div>

    <form id="surveyForm">
      <div id="questionsContainer"></div>
      <button type="submit" class="submit-button">Submit</button>
    </form>
  </div>

  <!-- Result Modal -->
  <div id="resultModal" class="modal hidden">
    <div class="modal-content">
      <span id="closeModal">&times;</span>
      <h2>Results</h2>
      <p id="resultMessage"></p>
      <a href="https://www.altuviiio.com" class="learn-more" target="_blank">Learn More</a>
    </div>
  </div>

  <script>
    const questions = [
      "I enjoy activities like swimming, biking, or hiking without joint concerns.",
      "I don’t worry about joint pain when taking stairs or walking long distances.",
      "I don’t experience joint stiffness when standing or sitting for long periods of time.",
      "I go about my daily routine (i.e. carrying groceries, lifting children, commuting to work) without fear of bleeds.",
      "I can be spontaneous with my plans.",
      "I rarely need to visit the ER for joint bleeds or trauma-related bleeds.",
      "I’m confident that I won’t be limited in my job/career because of my hemophilia A.",
      "I don’t live in fear or anxiety around my next bleed."
    ];

    const questionsContainer = document.getElementById('questionsContainer');
    const progressBar = document.getElementById('progressBar');
    const totalQuestions = questions.length;

    questions.forEach((question, index) => {
      const block = document.createElement('div');
      block.className = 'question-block';

      const questionText = document.createElement('div');
      questionText.className = 'question-text';
      questionText.textContent = `Q${index + 1}. ${question}`;

      const ratingOptions = document.createElement('div');
      ratingOptions.className = 'rating-options';

      for (let i = 1; i <= 8; i++) {
        const input = document.createElement('input');
        input.type = 'radio';
        input.name = `q${index}`;
        input.value = i;
        input.id = `q${index}_rating${i}`;

        const label = document.createElement('label');
        label.htmlFor = input.id;
        label.textContent = i;

        input.addEventListener('change', updateProgress);

        ratingOptions.appendChild(input);
        ratingOptions.appendChild(label);
      }

      block.appendChild(questionText);
      block.appendChild(ratingOptions);
      questionsContainer.appendChild(block);
    });

    function updateProgress() {
      let answered = 0;
      questions.forEach((_, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        if (selected) answered++;
      });
      const percent = (answered / totalQuestions) * 100;
      progressBar.style.width = `${percent}%`;
    }

    document.getElementById('surveyForm').addEventListener('submit', function(event) {
      event.preventDefault();

      let totalScore = 0;
      let answered = 0;

      questions.forEach((_, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        if (selected) {
          totalScore += parseInt(selected.value);
          answered++;
        }
      });

      if (answered < totalQuestions) {
        alert("Please answer all questions before submitting.");
        return;
      }

      const message = totalScore >= 48
        ? "Congratulations!🎉 <br>You have the VIII Factor. Keep up the good work."
        : "Womp. Womp.😿 <br>You have a room for improvement. See how you can secure the VIII Factor.";

      document.getElementById('resultMessage').textContent = message;
      document.getElementById('resultModal').classList.remove('hidden');
    });

    document.getElementById('closeModal').addEventListener('click', () => {
      document.getElementById('resultModal').classList.add('hidden');
    });
  </script>
</body>
</html>
